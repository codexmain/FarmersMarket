<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">Cancelar</ion-button>
    </ion-buttons>    
    <ion-buttons slot="end">
      <ion-button type="submit" form="editCategoryForm" fill="clear" expand="full">
        Modificar
      </ion-button>
    </ion-buttons>  
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false">
  <ion-card>
    <ion-card-header class="custom-card-header">Formulario Categorías</ion-card-header>
  <form id="editCategoryForm" (ngSubmit)="modificarCategoria()">

    <ion-item>
      <ion-label position="floating">Nombre Categoría</ion-label>
      <ion-input type="text" [(ngModel)]="nombre" name="nombre" minlength="5"  required #categoryCtrl="ngModel"></ion-input>
      <ion-button fill="outline" slot="end" (click)="clearNombre()">
        <ion-icon name="trash-bin-sharp" color="danger"></ion-icon>
      </ion-button>
    </ion-item>
    <div *ngIf="categoryCtrl.invalid && (categoryCtrl.dirty || categoryCtrl.touched)" class="error-message">
      El nombre de la Categoría es obligatorio y debe tener al menos 5 caracteres y un maximo de 50.
    </div>

    <ion-item>
      <ion-label>Estado Categoría:</ion-label>
      <ion-select [(ngModel)]="estado_categoria" name="estado_categoria" required #estadoCtrl="ngModel">
        <ion-select-option value="activa">Categoría Activa</ion-select-option>
        <ion-select-option value="deshabilitada">Categoría Deshabilitada</ion-select-option>
      </ion-select>
    </ion-item>
    <div *ngIf="estadoCtrl.invalid && (estadoCtrl.dirty || estadoCtrl.touched)" class="error-message">
      El estado de la categoria es obligatorio.
    </div>
  </form>
</ion-card>
</ion-content>
