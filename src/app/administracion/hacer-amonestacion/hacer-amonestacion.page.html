<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">Cancelar</ion-button>
    </ion-buttons>    
    <ion-buttons slot="end">
      <ion-button type="submit" form="makeWarnForm" fill="clear" expand="full">
        Hacer Amonestación
      </ion-button>
    </ion-buttons>  
  </ion-toolbar>
</ion-header>

<ion-content>
  <form id="makeWarnForm" (ngSubmit)="hacerAmonestacion()"> 
    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input [disabled]="isDisabledCorreo" type="email" name="correo" [(ngModel)]="correo" required email></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Descripción</ion-label>
      <ion-textarea name="descripcion" [(ngModel)]="descripcion" required></ion-textarea>
    </ion-item>
    <ion-note color="danger"
      *ngIf="amonestacionForm.controls['descripcion']?.invalid && amonestacionForm.controls['descripcion']?.touched">
      La descripción es obligatoria.
    </ion-note>

    <ion-item>
      <ion-label>Producto (opcional) </ion-label>
      <ion-select [disabled]="isDisabledIdProd" name="idProducto" [(ngModel)]="idProducto">
        <ion-select-option *ngFor="let producto of productos" [value]="producto.id">
          {{ producto.nombre_producto }}
        </ion-select-option>
      </ion-select>
    </ion-item>

  </form>
</ion-content>
