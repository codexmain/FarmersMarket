<ion-header>
  <ion-toolbar>
    <ion-title>Hacer Amonestación</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismissModal()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form #amonestacionForm="ngForm" (ngSubmit)="enviarAmonestacion(amonestacionForm)">
    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input type="email" name="correo" [(ngModel)]="correo" required email></ion-input>
    </ion-item>
    <ion-note color="danger"
      *ngIf="amonestacionForm.controls['correo']?.invalid && amonestacionForm.controls['correo']?.touched">
      El correo es obligatorio y debe ser válido.
    </ion-note>

    <ion-item>
      <ion-label position="floating">Descripción</ion-label>
      <ion-textarea name="descripcion" [(ngModel)]="descripcion" required></ion-textarea>
    </ion-item>
    <ion-note color="danger"
      *ngIf="amonestacionForm.controls['descripcion']?.invalid && amonestacionForm.controls['descripcion']?.touched">
      La descripción es obligatoria.
    </ion-note>

    <ion-item>
      <ion-label>Producto (opcional)</ion-label>
      <ion-select name="idProducto" [(ngModel)]="idProducto">
        <ion-select-option *ngFor="let producto of productos" [value]="producto.id">
          {{ producto.nombre_producto }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-button expand="full" type="submit" [disabled]="amonestacionForm.invalid">
      Enviar Amonestación
    </ion-button>
  </form>
</ion-content>
