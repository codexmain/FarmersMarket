<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">Cancelar</ion-button>
    </ion-buttons>    
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false">
  <ion-card>
    <ion-card-header class="custom-card-header">Detalles Categoría</ion-card-header>
    <ion-item>
      <ion-label position="floating">Nombre Categoría</ion-label>
      <ion-input [disabled]="isDisabled" type="text" [(ngModel)]="nombre" name="nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label>Estado Categoría:</ion-label>
      <ion-select [disabled]="isDisabled" [(ngModel)]="estado_categoria" name="estado_categoria">
        <ion-select-option value="activa">Categoría Activa</ion-select-option>
        <ion-select-option value="deshabilitada">Categoría Deshabilitada</ion-select-option>
      </ion-select>
    </ion-item>

</ion-card>
</ion-content>
